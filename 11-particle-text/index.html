<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>11 · Particle Text · frontend-lab</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #05060d; overflow: hidden; color: #eef2ff;
    font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", system-ui, sans-serif; }
  #cv { position: fixed; inset: 0; display: block; }
  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 32px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .num { font-size: 13px; color: #18d6c9; letter-spacing: .2em; font-weight: 700; }
  .head h1 { font-size: clamp(28px, 5vw, 52px); font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(120deg, #fff, #7c5cff 55%, #ff2e9a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,.45)); }
  .head .sub { color: #8b93b5; font-size: 14px; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; }
  .meta span { font-size: 11.5px; color: #b9c0e0; border: 1px solid rgba(255,255,255,.16);
    padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(6px); background: rgba(0,0,0,.25); }
  .hint { color: #5a637f; font-size: 12.5px; text-align: center; }
  a.top { position: fixed; top: 18px; right: 24px; z-index: 5; color: #8b93b5;
    font-size: 13px; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,.2); }
  a.top:hover { color: #fff; }
  @media (max-width: 640px) { .ui { padding: 20px; } .meta { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="top" href="../">← lab 首页</a>
<div class="ui">
  <div class="head">
    <span class="num">11</span>
    <h1>Particle Text</h1>
    <span class="sub">像素采样 + 弹簧重组 + 鼠标排斥</span>
  </div>
  <div class="meta">
    <span>Canvas 2D</span><span>getImageData</span><span>spring · damping</span>
    <span>pointer repel</span><span>additive blend</span>
  </div>
  <div class="hint">移动鼠标,粒子会被推开;离开后弹簧把它拉回字形</div>
</div>

<script>
(function () {
  "use strict";
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", { alpha: false });
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  var W = 0, H = 0;
  var particles = [];
  var mouse = { x: -9999, y: -9999, active: false };
  var rt = 0;

  // 物理/视觉参数
  var SPRING   = 0.085;  // 弹簧刚度 k
  var DAMPING  = 0.82;   // 速度阻尼 (1 = 无阻尼,接近 0 = 强阻尼)
  var REPEL_R  = 110;    // 鼠标排斥半径 (CSS px)
  var REPEL_F  = 14;     // 排斥力强度 (峰值位移 px/帧)
  var STEP     = 5;      // 像素采样步长
  var MAX_PTS  = 3600;   // 粒子数上限
  var TRAIL    = 0.22;   // 拖尾清屏 alpha (越小拖尾越长)

  // 品牌色:蓝 -> 青 -> 粉
  var C1 = [124, 92, 255];   // #7c5cff
  var C2 = [24, 214, 201];   // #18d6c9
  var C3 = [255, 46, 154];   // #ff2e9a

  function lerp(a, b, t) { return a + (b - a) * t; }

  // 三段渐变 (两段 lerp): t∈[0,0.5] 蓝→青, [0.5,1] 青→粉
  function gradColor(t) {
    var r, g, b, k;
    if (t < 0.5) {
      k = t * 2;
      r = lerp(C1[0], C2[0], k); g = lerp(C1[1], C2[1], k); b = lerp(C1[2], C2[2], k);
    } else {
      k = (t - 0.5) * 2;
      r = lerp(C2[0], C3[0], k); g = lerp(C2[1], C3[1], k); b = lerp(C2[2], C3[2], k);
    }
    return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
  }

  // 离屏 canvas 渲染文字 → getImageData → 按步长采 alpha>128 的像素作目标点
  function sampleText() {
    var off = document.createElement("canvas");
    off.width = W; off.height = H;
    var oc = off.getContext("2d");
    var fontSize = Math.min(W * 0.42, H * 0.62, 360);
    oc.fillStyle = "#fff";
    oc.textAlign = "center";
    oc.textBaseline = "middle";
    oc.font = "800 " + fontSize + "px -apple-system, Segoe UI, Helvetica, Arial, sans-serif";
    oc.fillText("GLM", W / 2, H / 2);

    var data = oc.getImageData(0, 0, W, H).data;
    var pts = [];
    for (var y = 0; y < H; y += STEP) {
      for (var x = 0; x < W; x += STEP) {
        if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
      }
    }
    // 粒子数太多则随机降采
    if (pts.length > MAX_PTS) {
      var ratio = MAX_PTS / pts.length;
      var kept = [];
      for (var i = 0; i < pts.length; i++) if (Math.random() < ratio) kept.push(pts[i]);
      pts = kept;
    }
    return pts;
  }

  function buildParticles(pts) {
    var cx = W / 2, cy = H / 2;
    var maxD = Math.hypot(cx, cy);
    var arr = [];
    for (var i = 0; i < pts.length; i++) {
      var px = pts[i][0], py = pts[i][1];
      // 上色: 横向 x 占比为主 + 距中心 enhance 端点亮色
      var d = Math.hypot(px - cx, py - cy) / maxD;
      var tx = (px - cx) / (W * 0.5) * 0.5 + 0.5;   // 归一化到 [0,1]
      var t = Math.min(1, Math.max(0, tx * 0.75 + d * 0.55 - 0.15));
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        tx: px, ty: py,
        vx: 0, vy: 0,
        color: gradColor(t)
      });
    }
    return arr;
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#05060d";
    ctx.fillRect(0, 0, W, H);

    particles = buildParticles(sampleText());

    if (reduce) {
      // 静态显示:粒子直接画到目标位,不跑动画/无排斥
      for (var j = 0; j < particles.length; j++) {
        var p = particles[j];
        ctx.fillStyle = p.color;
        ctx.fillRect(p.tx - 1, p.ty - 1, 2, 2);
      }
    }
  }

  function frame() {
    if (!reduce) {
      // 半透明清屏 → 拖尾 (source-over)
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(5, 6, 13, " + TRAIL + ")";
      ctx.fillRect(0, 0, W, H);

      // 加色叠加 → 辉光感
      ctx.globalCompositeOperation = "lighter";
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];

        // 弹簧力: a = (target - pos) * k
        var ax = (p.tx - p.x) * SPRING;
        var ay = (p.ty - p.y) * SPRING;
        // v = (v + a) * damping  —— 等价于 v += a 后 v *= damping,两步合一
        p.vx = (p.vx + ax) * DAMPING;
        p.vy = (p.vy + ay) * DAMPING;

        // 鼠标排斥: 半径内按 (1 - d/R) 线性衰减推开
        if (mouse.active) {
          var dx = p.x - mouse.x;
          var dy = p.y - mouse.y;
          var d2 = dx * dx + dy * dy;
          if (d2 < REPEL_R * REPEL_R) {
            var d = Math.sqrt(d2) || 0.01;
            var f = (1 - d / REPEL_R) * REPEL_F;
            p.vx += (dx / d) * f;
            p.vy += (dy / d) * f;
          }
        }

        p.x += p.vx;
        p.y += p.vy;

        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
      }
      ctx.globalCompositeOperation = "source-over";
    }
    requestAnimationFrame(frame);
  }

  // 事件: resize 防抖, pointer/touch 排斥源
  window.addEventListener("resize", function () {
    clearTimeout(rt); rt = setTimeout(resize, 150);
  });
  window.addEventListener("mousemove", function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener("mouseleave", function () { mouse.active = false; });
  window.addEventListener("touchmove", function (e) {
    if (e.touches[0]) {
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
    }
  }, { passive: true });
  window.addEventListener("touchend", function () { mouse.active = false; });

  resize();
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
