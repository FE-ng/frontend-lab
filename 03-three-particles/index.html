<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · Instanced Particles + Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; cursor: grab; }
  canvas { display: block; touch-action: none; }
  .overlay {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 10;
    pointer-events: none;
    color: rgba(255, 255, 255, 0.65);
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.03em;
  }
  .overlay .dim { color: rgba(255, 255, 255, 0.35); }
</style>
</head>
<body>
<div class="overlay"><span class="dim">03 · </span>Instanced Particles + Bloom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* -------- prefers-reduced-motion -------- */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const COUNT = reduced ? 600 : 2000;
const AUTO_ROT = reduced ? 0.0003 : 0.0015;
const BREATH_AMP = reduced ? 0.015 : 0.04;

/* -------- Renderer -------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05060a, 1);
document.body.appendChild(renderer.domElement);

/* -------- Scene & Camera -------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 13);

/* -------- Rotation group -------- */
const group = new THREE.Group();
scene.add(group);

/* -------- Instanced particles: Fibonacci sphere + vortex twist -------- */
const R = 5;
const geom = new THREE.SphereGeometry(0.075, 14, 10);
const mat = new THREE.MeshBasicMaterial({ toneMapped: false });
const mesh = new THREE.InstancedMesh(geom, mat, COUNT);

const dummy = new THREE.Object3D();
const color = new THREE.Color();
const cBot = new THREE.Color(0x4a00ff); // deep purple-blue
const cMid = new THREE.Color(0x00f0ff); // cyan
const cTop = new THREE.Color(0xff0080); // hot magenta

for (let i = 0; i < COUNT; i++) {
  // Fibonacci sphere distribution
  const phi = Math.acos(1 - 2 * (i + 0.5) / COUNT);
  const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);

  let x = R * Math.sin(phi) * Math.cos(theta);
  let y = R * Math.cos(phi);
  let z = R * Math.sin(phi) * Math.sin(theta);

  // Vortex twist — rotate around Y proportional to height
  const tw = (y / R) * 1.3;
  const ct = Math.cos(tw), st = Math.sin(tw);
  const rx = x * ct - z * st;
  const rz = x * st + z * ct;
  x = rx;
  z = rz;

  // Radial shimmer to break perfect symmetry
  const shimmer = 1 + 0.07 * Math.sin(i * 7.13) + 0.04 * Math.cos(i * 3.77);
  x *= shimmer;
  y *= shimmer;
  z *= shimmer;

  dummy.position.set(x, y, z);
  const s = 0.55 + 0.35 * Math.sin(i * 2.71) + 0.25 * Math.cos(i * 5.33);
  dummy.scale.setScalar(s);
  dummy.updateMatrix();
  mesh.setMatrixAt(i, dummy.matrix);

  // Color gradient by normalized height
  const t = (y / R + 1) * 0.5;
  if (t < 0.5) {
    color.lerpColors(cBot, cMid, t * 2);
  } else {
    color.lerpColors(cMid, cTop, (t - 0.5) * 2);
  }
  const bright = 0.6 + 0.5 * (0.5 + 0.5 * Math.sin(i * 3.14159 + 1.7));
  color.multiplyScalar(bright);
  mesh.setColorAt(i, color);
}

mesh.instanceMatrix.needsUpdate = true;
if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
group.add(mesh);

/* -------- Post-processing: Bloom -------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.3,  // strength
  0.55, // radius
  0.0   // threshold
);
composer.addPass(bloom);
composer.setSize(window.innerWidth, window.innerHeight); // 初次按 DPR 校准 bloom RT,避免高 DPR 下辉光半分辨率

/* -------- Pointer drag rotation (Euler 'YXZ' → quaternion) -------- */
let dragging = false;
let px = 0, py = 0;
let yaw = 0, pitch = 0;
let vyaw = 0, vpitch = 0;

const el = renderer.domElement;

el.addEventListener('pointerdown', (e) => {
  dragging = true;
  px = e.clientX;
  py = e.clientY;
  el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - px;
  const dy = e.clientY - py;
  vyaw = dx * 0.005;
  vpitch = dy * 0.005;
  yaw += vyaw;
  pitch += vpitch;
  pitch = Math.max(-Math.PI / 2 + 0.15, Math.min(Math.PI / 2 - 0.15, pitch));
  px = e.clientX;
  py = e.clientY;
});

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  try { el.releasePointerCapture(e.pointerId); } catch (_) { /* noop */ }
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

/* -------- Resize -------- */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  // 不再单独 bloom.setSize —— composer.setSize 会以 device pixel 回灌每个 pass;bloom.setSize 用 CSS 像素会把它覆盖成半分辨率
}
window.addEventListener('resize', resize);

/* -------- Animate -------- */
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (!dragging) {
    vyaw *= 0.94;
    vpitch *= 0.94;
    yaw += AUTO_ROT + vyaw;
    pitch += vpitch;
  }

  euler.set(pitch, yaw, 0);
  group.quaternion.setFromEuler(euler);

  // Slow breathing
  const breath = 1 + BREATH_AMP * Math.sin(t * 0.8);
  group.scale.setScalar(breath);

  composer.render();
}

animate();
</script>
</body>
</html>
