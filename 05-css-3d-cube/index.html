<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 3D Cube · Aurora Core</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c-magenta: #ff4dca;
    --c-cyan: #6affff;
    --c-violet: #b46bff;
    --c-amber: #ffc857;
    --c-lime: #8effc4;
    --bg: #050018;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    color: #fff;
  }

  /* ---------- Aurora background ---------- */
  .aurora {
    position: fixed;
    inset: -25%;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(48px);
    will-change: transform;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .aurora--1 {
    background:
      radial-gradient(circle at 18% 28%, rgba(255, 77, 202, 0.55), transparent 42%),
      radial-gradient(circle at 82% 18%, rgba(106, 255, 255, 0.5), transparent 46%),
      radial-gradient(circle at 50% 82%, rgba(180, 107, 255, 0.6), transparent 50%);
  }
  .aurora--2 {
    background:
      radial-gradient(circle at 72% 62%, rgba(255, 150, 60, 0.45), transparent 44%),
      radial-gradient(circle at 8% 72%, rgba(120, 255, 180, 0.42), transparent 50%);
    animation-duration: 28s;
    animation-delay: -6s;
  }
  .aurora--3 {
    background:
      radial-gradient(circle at 40% 34%, rgba(255, 244, 120, 0.28), transparent 40%),
      radial-gradient(circle at 92% 92%, rgba(200, 60, 255, 0.45), transparent 52%);
    animation-duration: 34s;
    animation-delay: -12s;
  }
  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); opacity: 0.85; }
    50%  { opacity: 1; }
    100% { transform: translate3d(4%, -3%, 0) scale(1.18) rotate(8deg); opacity: 0.75; }
  }

  /* faint starfield grain */
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8) 50%, transparent),
      radial-gradient(1px 1px at 70% 65%, rgba(255,255,255,0.6) 50%, transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.7) 50%, transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.5) 50%, transparent),
      radial-gradient(1px 1px at 12% 60%, rgba(255,255,255,0.6) 50%, transparent),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.4) 50%, transparent);
    background-repeat: no-repeat;
    opacity: 0.5;
    animation: twinkle 5s steps(4) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.65; }
  }

  /* ---------- Top title overlay ---------- */
  .title-overlay {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    padding: 38px 24px 0;
    text-align: center;
    pointer-events: none;
  }
  .title {
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1.1;
    background: linear-gradient(90deg, var(--c-magenta), var(--c-cyan), var(--c-violet), var(--c-magenta));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 7s linear infinite;
    text-shadow: 0 0 40px rgba(180, 107, 255, 0.25);
  }
  @keyframes shimmer {
    0%   { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }
  .subtitle {
    margin-top: 10px;
    font-size: clamp(11px, 1.3vw, 15px);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  .hint {
    position: fixed;
    bottom: 24px; left: 0; right: 0;
    text-align: center;
    z-index: 20;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: rgba(255, 255, 255, 0.32);
    pointer-events: none;
    text-transform: uppercase;
  }

  /* ---------- 3D stage ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 5;
    perspective: 1400px;
    perspective-origin: 50% 45%;
  }

  /* margin-based centering keeps 3D transform list clean */
  .holder {
    position: absolute;
    top: 55%; left: 50%;
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    transform-style: preserve-3d;
  }

  /* the whole assembly slowly tumbles */
  .scene {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
    animation: scene-spin 32s linear infinite;
  }
  @keyframes scene-spin {
    0%   { transform: rotateX(-18deg) rotateY(0deg) rotateZ(0deg); }
    100% { transform: rotateX(-18deg) rotateY(360deg) rotateZ(0deg); }
  }

  /* ---------- Outer glass cube ---------- */
  .cube {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
    animation: cube-spin 18s linear infinite;
    filter: drop-shadow(0 0 26px rgba(180, 107, 255, 0.55)) drop-shadow(0 0 60px rgba(106, 255, 255, 0.25));
  }
  @keyframes cube-spin {
    0%   { transform: rotateY(0deg) rotateX(12deg); }
    100% { transform: rotateY(360deg) rotateX(12deg); }
  }

  .face {
    position: absolute;
    width: 200px; height: 200px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 10px;
    background:
      linear-gradient(135deg, rgba(255, 80, 200, 0.18), rgba(80, 200, 255, 0.14) 50%, rgba(180, 80, 255, 0.18));
    backdrop-filter: blur(8px) saturate(140%);
    -webkit-backdrop-filter: blur(8px) saturate(140%);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.08),
      inset 0 0 40px rgba(255, 255, 255, 0.14),
      inset 0 0 90px rgba(120, 200, 255, 0.12),
      0 0 32px rgba(180, 80, 255, 0.35);
    overflow: hidden;
  }
  /* glossy diagonal sheen on every face */
  .face::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.1) 100%);
    pointer-events: none;
  }

  /* per-face tints for richer palette */
  .face--front  { background: linear-gradient(135deg, rgba(255, 77, 202, 0.22), rgba(106, 255, 255, 0.18)); transform: translateZ(100px); }
  .face--back   { background: linear-gradient(135deg, rgba(180, 107, 255, 0.22), rgba(255, 200, 87, 0.16)); transform: rotateY(180deg) translateZ(100px); }
  .face--right  { background: linear-gradient(135deg, rgba(142, 255, 196, 0.22), rgba(180, 107, 255, 0.2)); transform: rotateY(90deg)  translateZ(100px); }
  .face--left   { background: linear-gradient(135deg, rgba(255, 200, 87, 0.22),  rgba(106, 255, 255, 0.2)); transform: rotateY(-90deg) translateZ(100px); }
  .face--top    { background: linear-gradient(135deg, rgba(120, 80, 255, 0.24),  rgba(255, 77, 202, 0.18)); transform: rotateX(90deg)  translateZ(100px); }
  .face--bottom { background: linear-gradient(135deg, rgba(106, 255, 255, 0.2),  rgba(255, 244, 120, 0.18)); transform: rotateX(-90deg) translateZ(100px); }

  /* ---------- Inner core (counter-rotating) ---------- */
  .core {
    position: absolute;
    top: 50%; left: 50%;
    width: 80px; height: 80px;
    margin: -40px 0 0 -40px;
    transform-style: preserve-3d;
    will-change: transform;
    animation: core-spin 14s linear infinite reverse;
    filter: drop-shadow(0 0 16px rgba(255, 100, 200, 0.85)) drop-shadow(0 0 34px rgba(106, 255, 255, 0.5));
  }
  @keyframes core-spin {
    0%   { transform: rotateY(0deg) rotateX(-14deg); }
    100% { transform: rotateY(360deg) rotateX(-14deg); }
  }
  .core .face {
    width: 80px; height: 80px;
    border: 1px solid rgba(255, 220, 255, 0.6);
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(255, 100, 200, 0.55), rgba(106, 200, 255, 0.45));
    backdrop-filter: blur(3px) saturate(160%);
    -webkit-backdrop-filter: blur(3px) saturate(160%);
    box-shadow:
      inset 0 0 18px rgba(255, 255, 255, 0.45),
      inset 0 0 40px rgba(255, 100, 200, 0.35),
      0 0 22px rgba(255, 100, 200, 0.5);
  }
  .core .face--front  { transform: translateZ(40px); }
  .core .face--back   { transform: rotateY(180deg) translateZ(40px); }
  .core .face--right  { transform: rotateY(90deg)  translateZ(40px); }
  .core .face--left   { transform: rotateY(-90deg) translateZ(40px); }
  .core .face--top    { transform: rotateX(90deg)  translateZ(40px); }
  .core .face--bottom { transform: rotateX(-90deg) translateZ(40px); }

  /* ---------- Orbital rings ---------- */
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .ring--1 {
    width: 320px; height: 320px;
    margin: -160px 0 0 -160px;
    border: 2px solid rgba(106, 255, 255, 0.7);
    border-top-color: rgba(255, 255, 255, 0.9);
    border-bottom-color: rgba(180, 107, 255, 0.35);
    box-shadow:
      0 0 22px rgba(106, 255, 255, 0.55),
      inset 0 0 22px rgba(106, 255, 255, 0.3);
    animation: ring-1 10s linear infinite;
  }
  @keyframes ring-1 {
    0%   { transform: rotateX(76deg) rotateZ(0deg); }
    100% { transform: rotateX(76deg) rotateZ(360deg); }
  }

  .ring--2 {
    width: 420px; height: 420px;
    margin: -210px 0 0 -210px;
    border: 2px solid rgba(255, 200, 87, 0.6);
    border-right-color: rgba(255, 77, 202, 0.6);
    border-left-color: rgba(255, 255, 255, 0.85);
    box-shadow:
      0 0 28px rgba(255, 200, 87, 0.5),
      inset 0 0 28px rgba(255, 200, 87, 0.22);
    animation: ring-2 20s linear infinite reverse;
  }
  @keyframes ring-2 {
    0%   { transform: rotateY(72deg) rotateX(18deg) rotateZ(0deg); }
    100% { transform: rotateY(72deg) rotateX(18deg) rotateZ(360deg); }
  }

  .ring--3 {
    width: 260px; height: 260px;
    margin: -130px 0 0 -130px;
    border: 1px dashed rgba(142, 255, 196, 0.65);
    box-shadow:
      0 0 16px rgba(142, 255, 196, 0.35),
      inset 0 0 16px rgba(142, 255, 196, 0.2);
    animation: ring-3 9s linear infinite;
  }
  @keyframes ring-3 {
    0%   { transform: rotateX(58deg) rotateY(32deg) rotateZ(0deg); }
    100% { transform: rotateX(58deg) rotateY(32deg) rotateZ(-360deg); }
  }

  /* small glowing node that rides ring--1's perimeter (pure CSS via translateZ) */
  .node {
    position: absolute;
    top: 50%; left: 50%;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, rgba(106,255,255,0.9) 40%, rgba(106,255,255,0) 70%);
    box-shadow: 0 0 16px rgba(106, 255, 255, 0.9);
    transform: translateZ(160px);
  }
  .node--2 { transform: translateZ(-160px) scale(0.8); background: radial-gradient(circle, #fff, rgba(255,77,202,0.9) 40%, rgba(255,77,202,0) 70%); box-shadow: 0 0 16px rgba(255,77,202,0.9); }

  /* ---------- Reduced motion: freeze everything ---------- */
  @media (prefers-reduced-motion: reduce) {
    .aurora,
    .stars,
    .title,
    .scene,
    .cube,
    .core,
    .ring--1,
    .ring--2,
    .ring--3 {
      animation-play-state: paused;
    }
  }
</style>
</head>
<body>

  <!-- Aurora background layers (screen-blended) -->
  <div class="aurora aurora--1"></div>
  <div class="aurora aurora--2"></div>
  <div class="aurora aurora--3"></div>
  <div class="stars"></div>

  <!-- Top title overlay -->
  <header class="title-overlay">
    <h1 class="title">Aurora Core</h1>
    <p class="subtitle">Pure CSS · 3D · Glass Cube</p>
  </header>

  <!-- 3D stage -->
  <main class="stage">
    <div class="holder">
      <div class="scene">

        <!-- Orbital rings -->
        <div class="ring ring--2"></div>
        <div class="ring ring--1">
          <span class="node"></span>
          <span class="node node--2"></span>
        </div>
        <div class="ring ring--3"></div>

        <!-- Outer glass cube -->
        <div class="cube">
          <div class="face face--front"></div>
          <div class="face face--back"></div>
          <div class="face face--right"></div>
          <div class="face face--left"></div>
          <div class="face face--top"></div>
          <div class="face face--bottom"></div>
        </div>

        <!-- Inner counter-rotating core -->
        <div class="core">
          <div class="face face--front"></div>
          <div class="face face--back"></div>
          <div class="face face--right"></div>
          <div class="face face--left"></div>
          <div class="face face--top"></div>
          <div class="face face--bottom"></div>
        </div>

      </div>
    </div>
  </main>

  <div class="hint">Transform-Style · Preserve-3D · Perspective</div>

</body>
</html>
