<style>

    font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 32px; }
  .ui > * { pointer-events: auto; }

  a.top:hover { color: #fff; }

    font: 12px/1.5 "SFMono-Regular", Menlo, Consolas, monospace; white-space: pre-wrap; display: none; backdrop-filter: blur(4px); }
  @media (max-width: 640px) { .ui { padding: 20px; } .meta { display: none; } }

<body>
<canvas id="gl"></canvas>
<a class="top" href="../">← lab 首页</a>
<pre id="err"></pre>
<div class="ui">
  <div class="head">
    <span class="num">09</span>
    <h1>GLSL Raymarching</h1>
    <span class="sub">球/环/盒 SDF · smooth-min 融合 · 软阴影 + 菲涅尔金属</span>
  </div>
  <div class="meta">
    <span>WebGL1</span><span>raymarch</span><span>SDF union</span><span>smooth min</span><span>soft shadow</span><span>fresnel</span><span>mouse-orbit</span>
  </div>
  <div class="hint">移动鼠标微调相机朝向 · 液态金属随时间缓慢形变旋转</div>
</div>

<script id="vs" type="x-shader/x-vertex">attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_mouse;

const int   MAX_STEPS = 90;     // 步进循环上限(常量,满足 GLSL ES 1.00 循环约束)
const float MAX_DIST  = 30.0;
const float SURF_DIST  = 0.001;

// ---------- 旋转(返回旋转后坐标,规避对 swizzle 的写操作) ----------
vec3 rotX(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z); }
vec3 rotY(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z); }
vec3 rotZ(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x - s*p.y, s*p.x + c*p.y, p.z); }

// ---------- SDF 基元 ----------
float sdSphere(vec3 p, float r){ return length(p) - r; }
float sdBox(vec3 p, vec3 b){
  vec3 d = abs(p) - b;
  return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0);
}
float sdTorus(vec3 p, vec2 rt){
  vec2 q = vec2(length(p.xz) - rt.x, p.y);
  return length(q) - rt.y;
}

// ---------- smooth min:多项式融合,产生液态有机过渡 ----------
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

// ---------- 场景距离场:球 ∪ 环 ∪ 盒,smooth min 融合 ----------
float map(vec3 p){
  float t = u_time;
  // 全局缓慢自转 + 轻微摆动
  p = rotY(p, t * 0.25);
  p = rotX(p, sin(t * 0.15) * 0.35);

  // 半径呼吸 → 液态形变
  float r1 = 0.55 + 0.08 * sin(t * 0.9);
  float r2 = 0.50 + 0.08 * cos(t * 0.7);

  float s1 = sdSphere(p - vec3(sin(t) * 0.45, cos(t * 0.6) * 0.25, 0.0), r1);
  float s2 = sdSphere(p - vec3(-cos(t * 0.8) * 0.45, sin(t * 0.5) * 0.28, sin(t * 0.3) * 0.30), r2);

  // 轨道环
  vec3 pt = rotY(p, t * 0.5);
  float tor = sdTorus(pt, vec2(0.78, 0.16 + 0.04 * sin(t * 1.1)));

  // 旋转盒子
  vec3 pb = rotZ(p, t * 0.30);
  pb = rotX(pb, t * 0.40);
  float bx = sdBox(pb, vec3(0.32 + 0.05 * sin(t * 0.8)));

  // 布尔并集 + smooth min
  float d = smin(s1, s2, 0.30);
  d = smin(d, tor, 0.22);
  d = smin(d, bx, 0.28);
  return d;
}

// ---------- 射光线步进 ----------
float raymarch(vec3 ro, vec3 rd){
  float t = 0.0;
  for (int i = 0; i < MAX_STEPS; i++){
    float d = map(ro + rd * t);
    if (d < SURF_DIST) break;
    t += d;
    if (t > MAX_DIST) break;
  }
  return t;
}

// ---------- 法线:中心差分梯度(6 次采样) ----------
vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0008, 0.0);
  return normalize(vec3(
    map(p + e.xyy) - map(p - e.xyy),
    map(p + e.yxy) - map(p - e.yxy),
    map(p + e.yyx) - map(p - e.yyx)
  ));
}

// ---------- 环境光遮蔽 ----------
float calcAO(vec3 p, vec3 n){
  float occ = 0.0;
  float sca = 1.0;
  for (int i = 0; i < 5; i++){
    float hr = 0.02 + 0.12 * float(i) / 4.0;
    occ += (hr - map(p + n * hr)) * sca;
    sca *= 0.75;
  }
  return clamp(1.0 - 1.4 * occ, 0.0, 1.0);
}

// ---------- 软阴影(沿光源方向步进,取最近接近度) ----------
float softShadow(vec3 ro, vec3 rd){
  float res = 1.0;
  float t = 0.04;
  for (int i = 0; i < 24; i++){
    float h = map(ro + rd * t);
    if (h < 0.001) return 0.0;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.03, 0.4);
    if (t > 12.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

// ---------- 程序化环境(金属反射用) ----------
vec3 env(vec3 r){
  float sky = clamp(r.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 col = mix(vec3(0.04, 0.06, 0.12), vec3(0.28, 0.33, 0.42), pow(sky, 0.9));
  float s1 = pow(max(dot(r, normalize(vec3( 0.7, 0.8, -0.5))), 0.0), 96.0);
  float s2 = pow(max(dot(r, normalize(vec3(-0.6, 0.3,  0.6))), 0.0), 64.0);
  col += vec3(1.00, 0.92, 0.78) * s1 * 1.2;
  col += vec3(0.35, 0.55, 1.00) * s2 * 0.8;
  return col;
}

// ---------- 着色 ----------
vec3 render(vec3 ro, vec3 rd){
  vec3 bg = env(rd) * 0.55;
  float t = raymarch(ro, rd);
  if (t >= MAX_DIST) return bg;

  vec3 p = ro + rd * t;
  vec3 n = calcNormal(p);
  vec3 V = -rd;

  vec3 L1 = normalize(vec3(0.7, 0.9, -0.6));   // 主光
  vec3 L2 = normalize(vec3(-0.5, 0.3, 0.6));   // 补光
  float dif1 = clamp(dot(n, L1), 0.0, 1.0);
  float sha  = softShadow(p + n * 0.01, L1);
  dif1 *= sha;
  float dif2 = clamp(dot(n, L2), 0.0, 1.0) * 0.35;

  // Blinn-Phong 高光
  vec3  H1  = normalize(L1 + V);
  float spe = pow(clamp(dot(n, H1), 0.0, 1.0), 48.0) * sha;

  // 菲涅尔(Schlick 近似)
  float fre = pow(clamp(1.0 - max(dot(n, V), 0.0), 0.0, 1.0), 5.0);

  float ao  = calcAO(p, n);

  // 金属基底 + 轻微虹彩(有机液态金属质感)
  vec3 base = mix(vec3(0.50, 0.52, 0.56), vec3(0.72, 0.70, 0.66), 0.5 + 0.5 * n.y);
  vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + fre * 0.6 + 0.2 * n.y));
  vec3 refl = env(reflect(rd, n));

  float amb = (0.15 + 0.25 * (0.5 + 0.5 * n.y)) * ao;
  vec3 col  = base * (amb + dif1 * 0.9 + dif2)
            + spe  * vec3(1.0, 0.95, 0.85) * 1.1
            + refl * (0.25 + 0.65 * fre)
            + irid * 0.12 * fre;

  // 距离雾
  col = mix(col, bg, 1.0 - exp(-0.015 * t));
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;

  // 鼠标微调相机朝向(轨道)
  vec2 mp = (u_mouse - 0.5) * 2.0;            // -1..1, y 已在 JS 内翻转
  float yaw   = mp.x * 0.7;
  float pitch = clamp(-mp.y * 0.45, -0.6, 0.6);

  vec3 ro = vec3(0.0, 0.2, 3.6);
  ro = rotY(ro, yaw);
  ro = rotX(ro, pitch);

  vec3 fwd   = normalize(-ro);                // 望向原点
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
  vec3 up    = cross(fwd, right);
  vec3 rd    = normalize(fwd * 1.4 + right * uv.x + up * uv.y);

  vec3 col = render(ro, rd);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));   // gamma
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("gl");
  var gl = cv.getContext("webgl", { antialias: false, powerPreference: "high-performance" });
  var errEl = document.getElementById("err");
  if (!gl) {
    errEl.style.display = "block";
    errEl.textContent = "你的浏览器不支持 WebGL。";
    return;
  }
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 把任何 shader 编译/链接错误打到页面 + 控制台,便于排查
  function fail(msg) {
    console.error(msg);
    errEl.style.display = "block";
    errEl.textContent = msg;
  }

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var name = type === gl.VERTEX_SHADER ? "VERTEX" : "FRAGMENT";
      fail("[" + name + "] shader compile error:\n" + (gl.getShaderInfoLog(s) || "(no log)"));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  var vsSrc = document.getElementById("vs").textContent;
  var fsSrc = document.getElementById("fs").textContent;
  var vs = sh(gl.VERTEX_SHADER, vsSrc);
  var fs = sh(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return;

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    fail("Program link error:\n" + (gl.getProgramInfoLog(prog) || "(no log)"));
    return;
  }
  gl.useProgram(prog);

  // 全屏三角形覆盖整个视口(省一个 quad)
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aLoc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, "u_res");
  var uTime = gl.getUniformLocation(prog, "u_time");
  var uMouse = gl.getUniformLocation(prog, "u_mouse");

  // raymarch 较重,DPR 上限收到 1.5
  var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  var mx = 0.5, my = 0.5, tmx = 0.5, tmy = 0.5;

  function resize() {
    cv.width = Math.floor(window.innerWidth * DPR);
    cv.height = Math.floor(window.innerHeight * DPR);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", function (e) {
    tmx = e.clientX / window.innerWidth;
    tmy = 1 - e.clientY / window.innerHeight;   // 翻转 y,使 0 在底 1 在顶
  }, { passive: true });

  var start = performance.now();
  function frame() {
    mx += (tmx - mx) * 0.06;
    my += (tmy - my) * 0.06;
    // prefers-reduced-motion:不推进 u_time,渲染一帧静态画面
    var t = reduce ? 4.0 : (performance.now() - start) / 1000;
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uMouse, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) frame();
  else requestAnimationFrame(frame);
})();
</script>
</body>
