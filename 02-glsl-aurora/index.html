<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>02 · GLSL Aurora · frontend-lab</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #05060d; overflow: hidden; color: #eef2ff;
    font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 32px; }
  .ui > * { pointer-events: auto; }
  .head { display: flex; align-items: baseline; gap: 14px; }
  .num { font-size: 13px; color: #18d6c9; letter-spacing: .2em; font-weight: 700; }
  .head h1 { font-size: clamp(28px, 5vw, 52px); font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(120deg, #fff, #7c5cff 60%, #18d6c9); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,.4)); }
  .head .sub { color: #8b93b5; font-size: 14px; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .meta span { font-size: 11.5px; color: #b9c0e0; border: 1px solid rgba(255,255,255,.16); padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(6px); background: rgba(0,0,0,.2); }
  .hint { color: #5a637f; font-size: 12.5px; text-align: center; }
  a.top { position: fixed; top: 18px; right: 24px; z-index: 5; color: #8b93b5; font-size: 13px; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,.2); pointer-events: auto; }
  a.top:hover { color: #fff; }
  @media (max-width: 640px) { .ui { padding: 20px; } .meta { display: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<a class="top" href="../">← lab 首页</a>
<div class="ui">
  <div class="head">
    <span class="num">02</span>
    <h1>GLSL Aurora</h1>
    <span class="sub">手写 fragment shader · 域翘曲 FBM 噪声流体</span>
  </div>
  <div class="meta">
    <span>WebGL1</span><span>FBM 5 octaves</span><span>domain warping</span><span>cosine palette</span><span>mouse-reactive</span>
  </div>
  <div class="hint">移动鼠标扰动光场</div>
</div>

<script id="vs" type="x-shader/x-vertex">attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.02; a *= 0.5; } return v; }
vec3 pal(float t){ return clamp(0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + t)), 0.0, 1.0); }
void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 p = uv - 0.5; p.x *= u_res.x / u_res.y;
  float t = u_time * 0.12;
  // domain warping:用 FBM 扭动采样坐标,产生流体感
  vec2 q = vec2(fbm(p * 1.4 + t), fbm(p * 1.4 + vec2(3.1 + t, 1.7 - t)));
  float n = fbm(p * 2.2 + q * 2.4 + t * 0.6);
  vec3 col = pal(n * 0.8 + t * 0.5);
  col *= 0.55 + 0.9 * pow(n, 1.25);
  // 顶部冷光带,底部余晖
  col += vec3(0.0, 0.18, 0.34) * pow(1.0 - uv.y, 2.0) * 0.45;
  col += vec3(0.30, 0.12, 0.45) * pow(uv.y, 3.0) * 0.35;
  // 鼠标光晕
  vec2 m = (u_mouse - 0.5); m.x *= u_res.x / u_res.y;
  float md = length(p - m);
  col += 0.10 * exp(-md * 3.5) * vec3(0.55, 0.75, 1.0);
  // 暗角
  col *= 1.0 - 0.45 * length(p);
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("gl");
  var gl = cv.getContext("webgl", { antialias: false, powerPreference: "high-performance" });
  if (!gl) { document.body.insertAdjacentHTML("beforeend", "<p style='padding:20px;color:#888'>你的浏览器不支持 WebGL。</p>"); return; }
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // 全屏三角形(覆盖整个视口,省一个 quad)
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, "u_res");
  var uTime = gl.getUniformLocation(prog, "u_time");
  var uMouse = gl.getUniformLocation(prog, "u_mouse");

  var DPR = Math.min(devicePixelRatio || 1, 2);
  var mx = 0.5, my = 0.5, tmx = 0.5, tmy = 0.5;
  function resize() {
    cv.width = Math.floor(innerWidth * DPR);
    cv.height = Math.floor(innerHeight * DPR);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  resize(); addEventListener("resize", resize);
  addEventListener("pointermove", function (e) {
    tmx = e.clientX / innerWidth; tmy = 1 - e.clientY / innerHeight;
  }, { passive: true });

  var start = performance.now();
  function frame() {
    mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;
    var t = reduce ? 8.0 : (performance.now() - start) / 1000;
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uMouse, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduce) requestAnimationFrame(frame);
  }
  // 减少动效时只渲染一帧静态画面
  if (reduce) frame(); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
